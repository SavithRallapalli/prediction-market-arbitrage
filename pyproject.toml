[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-arbitrage"
version = "0.1.0"
description = "ML-assisted logical relation discovery and executable arbitrage research for prediction markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.9",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=3.3",
  "torch>=2.5",
  "transformers>=4.46",
]
optimization = ["ortools>=9.11"]
data = ["httpx>=0.27", "websockets>=13"]
dev = ["pytest>=8.3", "ruff>=0.7", "jupyterlab>=4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
